name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANGED_CODE_COVERAGE_THRESHOLD: 80
  DIFF_COVER_VERSION: 11.0.1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository (full history for changed-code coverage)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Set up Python for changed-code coverage
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Changed-code coverage gate
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install "diff-cover==${DIFF_COVER_VERSION}"
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="${CHANGED_CODE_COVERAGE_THRESHOLD}" \
            --format markdown:"${GITHUB_STEP_SUMMARY}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository (full history for changed-code coverage)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check --output-format=github .
          python -m ruff format --check .

      - name: Build
        run: |
          python -m compileall -q app tests
          python -c "from app.main import create_app"

      - name: Unit tests with coverage
        run: python -m pytest -ra --cov --cov-report=xml --cov-report=term

      - name: Changed-code coverage gate
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="${CHANGED_CODE_COVERAGE_THRESHOLD}" \
            --format markdown:"${GITHUB_STEP_SUMMARY}"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No committed environment files
        run: |
          files=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$files" ]; then
            echo "::error::Environment files must not be committed. Remove them and rotate any secrets they contain:"
            echo "$files"
            exit 1
          fi

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks

      - name: Scan git history for leaked secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
