name: Import Sprint Issues

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Path to the sprint issue CSV file in this repository"
        required: true
        default: "Sprint1Issues.csv"
        type: string
      dry_run:
        description: "Preview what would be created without creating issues"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  import-issues:
    name: Import issues from CSV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import sprint issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSV_PATH: ${{ inputs.csv_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/import_sprint_issues.py
